name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y gettext zip
      - name: Unit tests
        run: python3 -m unittest discover -s daemon/tests -v
      - name: Translations
        run: msgfmt --check --statistics -o /dev/null po/es.po
      - name: Build plasmoid packages
        run: sh tools/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: plasmoids
          path: build/*.plasmoid
