name: Release

# Push a tag like v0.2.0 to publish a GitHub release with both .plasmoid packages attached.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y gettext zip

      - name: Check that the tag matches the project version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          daemon=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' daemon/klaude_monitord/__init__.py)
          echo "tag=$tag daemon=$daemon"
          [ "$tag" = "$daemon" ] || { echo "::error::tag $tag != daemon version $daemon"; exit 1; }
          for m in plasmoids/*/metadata.json; do
            v=$(sed -n 's/.*"Version": *"\([^"]*\)".*/\1/p' "$m")
            [ "$tag" = "$v" ] || { echo "::error::tag $tag != $m version $v"; exit 1; }
          done

      - name: Unit tests
        run: python3 -m unittest discover -s daemon/tests -v

      - name: Build plasmoid packages
        run: sh tools/build.sh

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: Klaude Monitor ${{ github.ref_name }}
          generate_release_notes: true
          files: build/*.plasmoid
